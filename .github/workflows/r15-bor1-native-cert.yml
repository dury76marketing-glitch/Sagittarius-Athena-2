name: R15 Broker-Flat Integrated Native PostgreSQL Certification (branch only)
on:
  push:
    branches:
      - certification/r15-broker-flat-liveness-integrated
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sagtest
          POSTGRES_PASSWORD: sagtest
          POSTGRES_DB: sagtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagtest -d sagtest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://sagtest:sagtest@localhost:5432/sagtest
      SAGITTARIUS_ALLOW_LIVE_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact runtime dependencies
        run: npm ci --ignore-scripts
      - name: Verify original liveness defect on frozen deployed source
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {TradingLiveness} from './src/tradingLiveness.mjs';
          const scope={systemName:'CERT',ownerId:'native',mode:'LIVE',resetTimestampMs:0,liveDashboardStartMs:0};
          const d=new TradingLiveness(),now=Date.now();
          d.event({atMs:now-90000,attemptId:'orphaned-observer',stage:'SHADOW_SAINT',status:'PREPARED'},scope);
          const p=d.sample({settings:scope,memory:{atMs:now},queues:[{name:'entryEvaluationQueue',active:0,pending:0,oldestActiveMs:0}],workers:[{name:'scanner',lastSuccessMs:now,stalled:false}],health:{websocketFresh:true,scannerFresh:true,protectionOk:true,protectionFresh:true}});
          assert.equal(p.state,'LIVENESS_DEGRADED');
          console.log('ORIGINAL_LIVENESS_FALSE_WARNING_REPRODUCED');
          JS
      - name: Apply exact integrated candidate to frozen baseline
