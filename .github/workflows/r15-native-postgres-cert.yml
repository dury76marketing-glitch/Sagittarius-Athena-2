name: R15 Native PostgreSQL Certification (temporary / test-only)
on:
  push:
    branches:
      - certification/r15-native-pg-20261121
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sagtest
          POSTGRES_USER: sagtest
          POSTGRES_PASSWORD: sagtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagtest -d sagtest"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://sagtest:sagtest@localhost:5432/sagtest
      SAGITTARIUS_ALLOW_LIVE_TRADING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact application dependencies
        run: npm ci --ignore-scripts
      - name: Restore nonproduction native certification harness
        shell: bash
        run: |
          cat <<'CERT_TEST' | base64 -d | gzip -d > native_pg_cert.mjs
          
          CERT_TEST
          sed -i 's/,UNVALUED_LIVE_PENDING_SQL} from/,} from/' native_pg_cert.mjs
          node --check native_pg_cert.mjs
      - name: Native R15 baseline migrations and fixture
        run: |
          node native_pg_cert.mjs seed
          node native_pg_cert.mjs baseline
      - name: Apply candidate patch and verify exact delivered source hashes
        shell: bash
        run: |
          cat <<'CERT_PATCH' | base64 -d | gzip -d > /tmp/r15candidate.patch
          
          CERT_PATCH
          git apply --check /tmp/r15candidate.patch
          git apply /tmp/r15candidate.patch
          printf '%s\n' '2207b55887ad0c48e31d366811422f66f9471423a67f61475311be8f7eb57c16  src/db.mjs' '988e3e61b4c3c38935f13e8f31e67ba35d836a7c471a94b0c6ff7be1ed52a2f2  src/executionReporting.mjs' '1a074b1ec28b44dc9d8645e6d1bee779bd6097ad5db85d462190428639109b41  src/tradingLiveness.mjs' | sha256sum -c
      - name: Revalidate syntax
        run: npm run check
      - name: Native PostgreSQL same-fixture repaired replay
        run: node native_pg_cert.mjs candidate
