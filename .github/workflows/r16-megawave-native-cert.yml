      - name: Reproduce R15 original Galactic and stale pending contracts
        shell: bash
        run: |
          node r16-tests/r16_ge_contract.mjs "$PWD"
          node r16-tests/r16_pending_finance.mjs "$PWD"
          node --input-type=module <<'BASELINE'
          import assert from 'node:assert/strict';
          import {TradingLiveness} from './src/tradingLiveness.mjs';
          const s={systemName:'SGT-BASE',ownerId:'native',mode:'LIVE',resetTimestampMs:0};
          const l=new TradingLiveness(),n=Date.now();
          l.event({atMs:n-90000,attemptId:'old-shadow-observation',stage:'SHADOW_SAINT',status:'PREPARED'},s);
          const r=l.sample({settings:s,memory:{atMs:n},queues:[{name:'entryEvaluationQueue',active:0,pending:0,oldestActiveMs:0}],
            workers:[{name:'scanner',lastSuccessMs:n,stalled:false}],health:{websocketFresh:true,scannerFresh:true,protectionOk:true,protectionFresh:true}});
          assert.equal(r.state,'LIVENESS_DEGRADED');
          console.log('R16_FROZEN_ORIGINAL_LIVENESS_DEFECT_CONFIRMED');
          BASELINE
