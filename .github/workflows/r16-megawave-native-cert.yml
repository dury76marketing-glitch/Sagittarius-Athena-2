name: Sagittarius R16 MegaWave - Native PostgreSQL and Broker Proof
on:
  push:
    branches:
      - certification/r16-megawave-20261121
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sagtest
          POSTGRES_USER: sagtest
          POSTGRES_PASSWORD: sagtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagtest -d sagtest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://sagtest:sagtest@localhost:5432/sagtest
      ALLOW_LIVE_TRADING: 'false'
      SAGITTARIUS_ALLOW_LIVE_TRADING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frozen original dependencies
        run: npm ci --ignore-scripts
